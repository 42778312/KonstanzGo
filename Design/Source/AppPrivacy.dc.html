<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stats: false, crash: true };
  }
  renderVals() {
    var self = this, s = this.state;
    function bg(on) { return on ? '#05944F' : '#E9E9EB'; }
    function kn(on) { return on ? 'translateX(20px)' : 'translateX(0)'; }
    return {
      stats: s.stats, crash: s.crash,
      statsBg: bg(s.stats), crashBg: bg(s.crash), statsKnob: kn(s.stats), crashKnob: kn(s.crash),
      toggleStats: function () { self.setState({ stats: !self.state.stats }); },
      toggleCrash: function () { self.setState({ crash: !self.state.crash }); }
    };
  }
}
</script>

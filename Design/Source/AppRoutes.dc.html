<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, swapped: false };
  }
  renderVals() {
    var self = this;
    var s = this.state.sel;
    function b(i) { return s === i ? '#000000' : '#E2E2E2'; }
    function sh(i) { return s === i ? 'transparent' : 'transparent'; }
    return {
      sel0: s === 0, sel1: s === 1, sel2: s === 2,
      b0: b(0), b1: b(1), b2: b(2),
      s0: sh(0), s1: sh(1), s2: sh(2),
      swapRot: this.state.swapped ? 'rotate(180deg)' : 'rotate(0deg)',
      pick0: function () { self.setState({ sel: 0 }); },
      pick1: function () { self.setState({ sel: 1 }); },
      pick2: function () { self.setState({ sel: 2 }); },
      swap: function () { self.setState({ swapped: !self.state.swapped }); }
    };
  }
}

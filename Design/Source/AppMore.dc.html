<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { notif: true, access: false, loading: false, updated: false };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    var self = this, s = this.state;
    function bg(on) { return on ? '#05944F' : '#E9E9EB'; }
    function knob(on) { return on ? 'translateX(20px)' : 'translateX(0)'; }
    return {
      notif: s.notif, access: s.access,
      notifBg: bg(s.notif), accessBg: bg(s.access),
      notifKnob: knob(s.notif), accessKnob: knob(s.access),
      spin: s.loading ? 'k-spin .8s linear infinite' : 'none',
      offlineSub: s.loading ? 'Wird aktualisiert …' : (s.updated ? 'Gerade aktualisiert' : 'Aktuell · Konstanz komplett'),
      toggleNotif: function () { self.setState({ notif: !self.state.notif }); },
      toggleAccess: function () { self.setState({ access: !self.state.access }); },
      refresh: function () {
        if (self.state.loading) return;
        self.setState({ loading: true });
        self.t = setTimeout(function () { self.setState({ loading: false, updated: true }); }, 1600);
      }
    };
  }
}
</script>

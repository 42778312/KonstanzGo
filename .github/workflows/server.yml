# The live server: shared API on Linux, server tests, the Docker image; a server-v* tag publishes the image.
# Never calls EFA-BW: tests use recorded fixtures only.
name: Server

on:
  push:
    branches: [main, "review/**"]
    tags: ["server-v*"]
    paths: ["Server/**", "Packages/KGLiveAPI/**", "App/Resources/Data/timetable.db", ".github/workflows/server.yml"]
  pull_request:
    paths: ["Server/**", "Packages/KGLiveAPI/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-shared:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Shared API builds and passes on Linux
        run: swift test --package-path Packages/KGLiveAPI

  server:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev
      - name: Tests
        run: swift test --package-path Server

  image:
    needs: [linux-shared, server]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/server-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, and push on a server-v* tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Server/Dockerfile
          build-args: LIVE_VERSION=${{ startsWith(github.ref, 'refs/tags/server-v') && github.ref_name || 'ci' }}
          push: ${{ startsWith(github.ref, 'refs/tags/server-v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/server-v') }}
          tags: ghcr.io/42778312/konstanzgo-live:${{ startsWith(github.ref, 'refs/tags/server-v') && github.ref_name || 'ci' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep konstanzgo-live || true

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>KonstanzGo Offline-Daten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
@keyframes k-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes k-ring{from{stroke-dashoffset:302}to{stroke-dashoffset:0}}
@keyframes k-pop{0%{opacity:0;transform:scale(.4)}65%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes k-seg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes k-load{from{width:0}to{width:100%}}
@media (prefers-reduced-motion: reduce){.sr *{animation:none !important}}
</style>
</helmet>
<div class="sr" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F6F6; font-family: Figtree, Arial, sans-serif; color: #000000">

<div style="position: absolute; left: 8px; top: 54px; height: 50px; display: flex; align-items: center">
<a href="AppMore.dc.html" style="height: 44px; padding: 0 8px; display: flex; align-items: center; gap: 2px; font-size: 17px; font-weight: 600; color: #276EF1"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#276EF1" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Mehr</a>
</div>
<h1 style="position: absolute; left: 20px; top: 106px; margin: 0; font-family: Figtree, Arial, sans-serif; font-weight: 700; font-size: 32px">Offline-Daten</h1>

<div style="position: absolute; left: 16px; right: 16px; top: 160px; border-radius: 22px; background: #FFFFFF; padding: 16px; animation: k-up .4s ease both">
<div style="display: flex; align-items: center; gap: 16px">
<div style="position: relative; width: 104px; height: 104px; flex: none">
<svg width="104" height="104" viewBox="0 0 104 104" style="transform: rotate(-90deg)" aria-hidden="true"><circle cx="52" cy="52" r="48" fill="none" stroke="#E6F4EC" stroke-width="8"></circle><circle cx="52" cy="52" r="48" fill="none" stroke="#05944F" stroke-width="8" stroke-linecap="round" stroke-dasharray="302" style="animation: k-ring 1.3s cubic-bezier(.4,0,.2,1) .2s both"></circle></svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: Figtree, Arial, sans-serif; font-weight: 700; font-size: 26px">{{total}}</span><span style="font-size: 12px; font-weight: 800; color: #545454">MB</span></div>
</div>
<div style="flex: 1">
<span style="height: 26px; padding: 0 10px 0 6px; border-radius: 13px; background: #E6F4EC; color: #05944F; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 800; animation: k-pop .4s ease 1.3s both"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#05944F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Alles aktuell</span>
<div style="font-size: 17px; font-weight: 800; margin-top: 8px">Bereit ohne Netz</div>
<div style="font-size: 13px; color: #545454">Heute um 06:12 aktualisiert</div>
</div>
</div>
<div style="display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 16px; gap: 3px">
<span style="flex: 52; background: #F05A62; transform-origin: left; animation: k-seg .6s ease .4s both"></span>
<span style="flex: 21; background: #FFC043; transform-origin: left; animation: k-seg .6s ease .55s both"></span>
<span style="flex: 13; background: #05944F; transform-origin: left; animation: k-seg .6s ease .7s both"></span>
</div>
<div style="display: flex; gap: 14px; margin-top: 8px; font-size: 12px; font-weight: 700; color: #545454">
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F05A62"></span>Karte 52 MB</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FFC043"></span>Fahrpläne 21 MB</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #05944F"></span>Haltestellen 13 MB</span>
</div>
</div>

<div style="position: absolute; left: 20px; top: 390px; font-size: 13px; font-weight: 800; letter-spacing: .06em; color: #545454">GEBIETE</div>
<div style="position: absolute; left: 16px; right: 16px; top: 414px; border-radius: 20px; background: #FFFFFF; overflow: hidden; animation: k-up .4s ease .15s both">
<div style="height: 62px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #E2E2E2">
<div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Konstanz Stadt</div><div style="font-size: 13px; color: #545454">64 MB</div></div>
<span style="width: 28px; height: 28px; border-radius: 14px; background: #05944F; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
</div>
<div style="position: relative; height: 62px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #E2E2E2">
<div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Reichenau &amp; Allensbach</div><div style="font-size: 13px; color: #545454">{{regionSub}}</div></div>
<sc-if value="{{rIdle}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{download}}" style="height: 34px; padding: 0 14px; border-radius: 12px; border: none; background: #F05A62; box-shadow: none; color: #FFFFFF; font-family: Figtree, Arial, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0; cursor: pointer">Laden</button></sc-if>
<sc-if value="{{rLoading}}" hint-placeholder-val="{{ false }}"><span style="width: 74px; height: 8px; border-radius: 4px; background: #E2E2E2; overflow: hidden"><span style="display: block; height: 100%; border-radius: 4px; background: #F05A62; animation: k-load 2s linear both"></span></span></sc-if>
<sc-if value="{{rDone}}" hint-placeholder-val="{{ false }}"><span style="width: 28px; height: 28px; border-radius: 14px; background: #05944F; display: flex; align-items: center; justify-content: center; animation: k-pop .4s ease both"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
</div>
<div style="height: 62px; display: flex; align-items: center; gap: 12px; padding: 0 16px">
<div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Kreuzlingen (CH)</div><div style="font-size: 13px; color: #545454">12 MB · nicht geladen</div></div>
<button type="button" style="height: 34px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #000000; box-shadow: none; background: #FFFFFF; color: #000000; font-family: Figtree, Arial, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0; cursor: pointer">Laden</button>
</div>
</div>

<div style="position: absolute; left: 16px; right: 16px; top: 616px; height: 60px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 16px; animation: k-up .4s ease .25s both">
<div style="flex: 1"><div style="font-size: 16px; font-weight: 800">Automatisch aktualisieren</div><div style="font-size: 13px; color: #545454">Nur im WLAN</div></div>
<button type="button" role="switch" aria-checked="{{auto}}" aria-label="Automatisch aktualisieren" onClick="{{toggleAuto}}" style="width: 51px; height: 31px; border-radius: 16px; border: none; padding: 0; position: relative; cursor: pointer; background: {{autoBg}}; transition: background .25s"><span style="position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transform: {{autoKnob}}; transition: transform .3s cubic-bezier(.3,1.3,.5,1)"></span></button>
</div>

<button type="button" onClick="{{download}}" style="position: absolute; left: 20px; right: 20px; bottom: 44px; height: 52px; border-radius: 8px; border: none; background: #F05A62; box-shadow: none; color: #FFFFFF; font-family: Figtree, Arial, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0; cursor: pointer">Jetzt aktualisieren</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { region: 'idle', auto: true };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    var self = this, s = this.state;
    return {
      rIdle: s.region === 'idle', rLoading: s.region === 'loading', rDone: s.region === 'done',
      regionSub: s.region === 'idle' ? '38 MB · nicht geladen' : (s.region === 'loading' ? 'Wird geladen …' : '38 MB · gespeichert'),
      total: s.region === 'done' ? '124' : '86',
      auto: s.auto, autoBg: s.auto ? '#05944F' : '#E9E9EB', autoKnob: s.auto ? 'translateX(20px)' : 'translateX(0)',
      toggleAuto: function () { self.setState({ auto: !self.state.auto }); },
      download: function () {
        if (self.state.region !== 'idle') return;
        self.setState({ region: 'loading' });
        self.t = setTimeout(function () { self.setState({ region: 'done' }); }, 2000);
      }
    };
  }
}
</script>
</body>
</html>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mins: 5 };
  }
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () {
      var m = self.state.mins - 1;
      self.setState({ mins: m < 0 ? 5 : m });
    }, 750);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var m = this.state.mins;
    return { eta: m === 0 ? 'Jetzt' : m + ' Min.' };
  }
}
</script>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { loc: false, notif: false };
  }
  componentDidMount() {
    var self = this;
    this.t1 = setTimeout(function () { self.setState({ loc: true }); }, 1600);
    this.t2 = setTimeout(function () { self.setState({ notif: true }); }, 2200);
  }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); }
  renderVals() {
    var self = this;
    var loc = this.state.loc, notif = this.state.notif;
    return {
      locOn: loc,
      notifOn: notif,
      locBg: loc ? '#05944F' : '#E9E9EB',
      notifBg: notif ? '#05944F' : '#E9E9EB',
      locKnob: loc ? 'translateX(20px)' : 'translateX(0)',
      notifKnob: notif ? 'translateX(20px)' : 'translateX(0)',
      toggleLoc: function () { clearTimeout(self.t1); self.setState({ loc: !self.state.loc }); },
      toggleNotif: function () { clearTimeout(self.t2); self.setState({ notif: !self.state.notif }); }
    };
  }
}
</script>
